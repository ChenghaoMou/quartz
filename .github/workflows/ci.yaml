name: Site checks

on:
  pull_request:
  push:
    branches: [v5, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Link site-local Quartz plugins
        run: npm run install-plugins
      - name: Verify curated public content
        run: npm run content:check
      - name: Typecheck, format, and test
        run: npm run site:check
      - name: Build production site
        run: npm run site:build

      - uses: actions/upload-artifact@v7
        with:
          name: public-site
          path: public
          if-no-files-found: error
